name: Deploy Frontend to VPS

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [dev]

concurrency:
  group: deploy-frontend-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Deploy verified commit
        working-directory: /home/hermes/Projects/Frontend-Lembar
        run: |
          set -eu
          git fetch origin dev
          git checkout -B dev ${{ github.event.workflow_run.head_sha }}
          pnpm install --frozen-lockfile
          pnpm run build
          pm2 restart lembar-frontend --update-env
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
