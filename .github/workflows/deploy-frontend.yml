name: Deploy Frontend to VPS

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [dev]

concurrency:
  group: deploy-frontend-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Deploy verified commit to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd ~/Projects/Frontend-Lembar
            git fetch origin dev
            git checkout -B dev ${{ github.event.workflow_run.head_sha }}
            pnpm install --frozen-lockfile
            pnpm run build
            pm2 restart lembar-frontend --update-env
            sleep 3
            curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
            pm2 status lembar-frontend
