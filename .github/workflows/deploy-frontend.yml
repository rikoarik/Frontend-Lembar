name: Deploy Frontend to VPS

on:
  push:
    branches: [dev]
    paths:
      - 'app/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'tsconfig.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/Projects/Frontend-Lembar

            # Pull latest changes
            git pull origin dev

            # Install dependencies
            pnpm install --frozen-lockfile

            # Build for production
            pnpm run build

            # Restart PM2
            pm2 restart lembar-frontend --update-env

            # Check status
            pm2 status lembar-frontend

            echo "✅ Frontend deployed successfully!"
