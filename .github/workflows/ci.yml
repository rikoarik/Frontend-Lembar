name: ci

on:
  push:
    branches: [main, dev, ao/frontend-integration, feat/**]
  pull_request:
    branches: [main, dev, ao/frontend-integration]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-build:
    name: lint • typecheck • format • test • audit • build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit and component tests
        run: pnpm run test

      - name: Secret scan
        run: pnpm run secret:scan

      - name: Production dependency audit
        run: pnpm run audit:prod

      - name: Production build
        run: pnpm run build

  playwright-smoke:
    name: playwright smoke
    runs-on: ubuntu-latest
    needs: static-and-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: pnpm exec playwright test --project=desktop --project=mobile

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            docs/frontend/screenshots
            test-results
          if-no-files-found: ignore
          retention-days: 7
